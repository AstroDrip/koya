map $server_port $upstream_service {
    80 main:8001;
    8002 voice-lookup:8002;
    8003 voice-write:8003;
    8004 sarvam-events:8004;
    8005 whatsapp-events:8005;
}

server {
    listen 80;
    listen 8002;
    listen 8003;
    listen 8004;
    listen 8005;
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://$upstream_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 40s;
    }
}
