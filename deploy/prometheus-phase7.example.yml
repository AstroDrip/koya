global:
  scrape_interval: 15s

rule_files:
  - prometheus-rules.yml

scrape_configs:
  - job_name: mrcare-apis
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/mrcare_metrics_key
    dns_sd_configs:
      - names: [main]
        type: A
        port: 8001
    static_configs:
      - targets:
          - voice-lookup:8002
          - voice-write:8003
          - sarvam-events:8004
          - whatsapp-events:8005
